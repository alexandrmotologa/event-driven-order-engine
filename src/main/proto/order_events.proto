syntax = "proto3";

package com.engine.order.infrastructure.adapter.out.messaging.protobuf;

option java_multiple_files = true;
option java_package = "com.engine.order.infrastructure.adapter.out.messaging.protobuf";
option java_outer_classname = "OrderEventsProto";

message OrderCreatedProto {
  string event_id = 1;
  string order_id = 2;
  string customer_id = 3;
  string currency = 4;
  string total_amount = 5;
  int64 timestamp = 6;
  int64 sequence_number = 7;
}

message OrderValidatedProto {
  string event_id = 1;
  string order_id = 2;
  int64 timestamp = 3;
  int64 sequence_number = 4;
}

message OrderPaidProto {
  string event_id = 1;
  string order_id = 2;
  string transaction_id = 3;
  int64 timestamp = 4;
  int64 sequence_number = 5;
}

message OrderCompletedProto {
  string event_id = 1;
  string order_id = 2;
  int64 timestamp = 3;
  int64 sequence_number = 4;
}

message OrderCancelledProto {
  string event_id = 1;
  string order_id = 2;
  string reason = 3;
  int64 timestamp = 4;
  int64 sequence_number = 5;
}

message OrderEventEnvelopeProto {
  string event_id = 1;
  string order_id = 2;
  string event_type = 3;
  int64 sequence_number = 4;
  int64 timestamp = 5;
  bytes payload = 6;
}
